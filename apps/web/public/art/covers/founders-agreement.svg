    <rect x="66" y="22" width="170" height="198" rx="4" fill="#e4e7f6" transform="translate(6 6)"/>
    <rect x="66" y="22" width="170" height="198" rx="4" fill="#fff" stroke="#141b47" stroke-width="3"/>
    <path d="M86 44 h96" stroke="#141b47" stroke-width="5"/>
    <path d="M86 64 h130 M86 76 h120 M86 88 h128 M86 100 h96 M86 116 h130 M86 128 h110" stroke="#141b47" stroke-width="2.5" opacity=".45"/>
    <!-- two signature lines, both signed -->
    <path d="M86 186 h56 M160 186 h56" stroke="#141b47" stroke-width="2.5"/>
    <path d="M88 178 c 6 -16 12 -2 16 -10 c 4 -8 8 6 14 -4 c 4 -6 8 2 14 -2" stroke="#3b4aa3" stroke-width="3"/>
    <path d="M162 176 c 8 -14 10 4 18 -6 c 6 -8 6 8 14 0 c 4 -4 10 -2 16 -8" stroke="#1e7a4e" stroke-width="3"/>
  </g>
  <!-- red seal with ribbon -->
  <g transform="translate(236 170)">
    <path d="M-14 16 l-10 40 l14 -8 l8 14 l8 -42 M14 16 l10 40 l-14 -8 l-8 14 l-8 -42" fill="#c94a36" stroke="#141b47" stroke-width="2.5"/>
    <path d="M0 -30 l8 8 l11 -2 l2 11 l9 6 l-5 10 l5 10 l-9 6 l-2 11 l-11 -2 l-8 8 l-8 -8 l-11 2 l-2 -11 l-9 -6 l5 -10 l-5 -10 l9 -6 l2 -11 l11 2z" fill="#c94a36" stroke="#141b47" stroke-width="3"/>
    <circle r="13" stroke="#fbe5df" stroke-width="2.5"/>
    <path d="M-6 0 l4 4 l8 -8" stroke="#fbe5df" stroke-width="3"/>
  </g>
  <!-- pen -->
  <g transform="translate(30 132) rotate(-35)">
    <rect width="14" height="84" rx="6" fill="#141b47"/>
    <path d="M0 84 l7 18 l7 -18" fill="#f2a900" stroke="#141b47" stroke-width="2.5"/>
    <path d="M7 6 v34" stroke="#f2a900" stroke-width="3"/>
