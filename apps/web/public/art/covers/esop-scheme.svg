<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="240" fill="#f1f3fb"/>
  <!-- share certificates stacked like a planter, a sapling growing over four years -->
  <g transform="translate(90 150)">
    <rect x="0" y="40" width="140" height="34" rx="4" fill="#fff6dc" stroke="#141b47" stroke-width="3"/>
    <rect x="8" y="20" width="140" height="34" rx="4" fill="#fff" stroke="#141b47" stroke-width="3"/>
    <rect x="-4" y="0" width="148" height="34" rx="4" fill="#fff" stroke="#141b47" stroke-width="3"/>
    <rect x="4" y="6" width="132" height="22" rx="2" stroke="#f2a900" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="118" cy="17" r="7" fill="#c94a36"/>
    <path d="M14 17 h60" stroke="#141b47" stroke-width="3" opacity=".5"/>
  </g>
  <!-- sapling -->
  <path d="M160 150 C 160 120, 158 96, 162 60" stroke="#1e7a4e" stroke-width="5"/>
  <path d="M160 128 c -26 -2 -36 -18 -36 -30 c 22 0 34 12 36 30z" fill="#cde9d9" stroke="#1e7a4e" stroke-width="3"/>
  <path d="M160 108 c 24 -4 34 -20 34 -32 c -22 2 -32 16 -34 32z" fill="#cde9d9" stroke="#1e7a4e" stroke-width="3"/>
  <path d="M161 84 c -18 -6 -24 -20 -22 -30 c 16 4 22 16 22 30z" fill="#cde9d9" stroke="#1e7a4e" stroke-width="3"/>
  <path d="M162 60 c 4 -12 14 -18 22 -18 c -2 12 -10 18 -22 18z" fill="#1e7a4e" stroke="#1e7a4e" stroke-width="3"/>
  <!-- vesting ticks: one leaf a year -->
  <g transform="translate(232 54)" stroke="#141b47" stroke-width="2.5">
    <rect x="0" y="0" width="56" height="92" rx="6" fill="#fff"/>
    <circle cx="16" cy="18" r="7" fill="#1e7a4e"/>
    <circle cx="16" cy="38" r="7" fill="#1e7a4e"/>
    <circle cx="16" cy="58" r="7" fill="#cde9d9"/>
    <circle cx="16" cy="78" r="7" fill="#fff"/>
    <path d="M30 18 h16 M30 38 h16 M30 58 h16 M30 78 h16" opacity=".5"/>
  </g>
</svg>
