<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- stack of three files tied with tape -->
  <g transform="translate(54 92)">
    <rect x="18" y="104" width="230" height="52" rx="6" fill="#d9bd72" stroke="#141b47" stroke-width="3"/>
    <rect x="6" y="64" width="240" height="52" rx="6" fill="#e8cf8f" stroke="#141b47" stroke-width="3"/>
    <rect x="22" y="22" width="226" height="54" rx="6" fill="#fff" transform="translate(6 6)"/>
    <rect x="22" y="22" width="226" height="54" rx="6" fill="#e8cf8f" stroke="#141b47" stroke-width="3"/>
    <path d="M36 22 l10 -16 h60 l10 16" fill="#e8cf8f" stroke="#141b47" stroke-width="3"/>
    <path d="M54 46 h70 M54 58 h40" stroke="#141b47" stroke-width="3" opacity=".5"/>
    <path d="M26 92 h60 M40 134 h50" stroke="#141b47" stroke-width="3" opacity=".35"/>
    <!-- paper edges between files -->
    <path d="M30 78 h208 M24 118 h214" stroke="#fff" stroke-width="4"/>
    <!-- tape around the stack -->
    <path d="M190 18 v142" stroke="#c94a36" stroke-width="7"/>
    <path d="M190 20 c -22 -26 -40 -6 -18 0 c 10 2 14 0 18 0 c 4 0 8 2 18 0 c 22 -6 4 -26 -18 0" fill="#fbe5df" stroke="#c94a36" stroke-width="4.5"/>
  </g>
  <!-- loose sheets with a clip -->
  <g transform="translate(250 12) rotate(12)">
    <rect x="0" y="0" width="96" height="120" rx="4" fill="#fff" stroke="#141b47" stroke-width="2.5"/>
    <rect x="-10" y="8" width="96" height="120" rx="4" fill="#fff" stroke="#141b47" stroke-width="2.5"/>
    <path d="M6 34 h58 M6 50 h66 M6 66 h44 M6 82 h62" stroke="#3b4aa3" stroke-width="2.5" opacity=".5"/>
    <path d="M64 -4 v40 a8 8 0 0 0 16 0 v-34 a5 5 0 0 0 -10 0 v30" stroke="#5b6478" stroke-width="3"/>
  </g>
  <!-- pen -->
  <g transform="translate(28 72) rotate(-30)">
    <rect x="0" y="0" width="16" height="96" rx="7" fill="#3b4aa3" stroke="#141b47" stroke-width="3"/>
    <path d="M0 96 l8 20 l8 -20" fill="#fff6dc" stroke="#141b47" stroke-width="3"/>
    <path d="M8 6 v40" stroke="#f2a900" stroke-width="3"/>
  </g>
</svg>
