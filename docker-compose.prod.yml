# Production stack on one server: Postgres (docker-compose.selfdb.yml), API, web and Caddy (HTTPS).
# Only Caddy is reachable from the internet. The server never builds anything: GitHub Actions builds the
# images on every push to main and publishes them to GitHub's container registry; this file pulls them.
#
# Start or update everything (picks the database setup, pulls, restarts, warms the pages):
#   ./deploy/up.sh
#
# Using a managed database instead (DATABASE_URL set in .env.production): up.sh leaves out the selfdb file.
# To build the images yourself instead of pulling: add -f docker-compose.build.yml and --build.
services:
  # Runs once per deploy: applies migrations, then adds any new seed items (never overwrites edits).
  migrate:
    image: ${FOUNDURA_IMAGES:-ghcr.io/prahladnb-spec/foundura}-api:${FOUNDURA_TAG:-latest}
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    # The managed database's CA certificate, referenced by sslrootcert in DATABASE_URL.
    volumes: ["./deploy/certs:/certs:ro"]
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    restart: "no"

  api:
    image: ${FOUNDURA_IMAGES:-ghcr.io/prahladnb-spec/foundura}-api:${FOUNDURA_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      TRUST_PROXY: "1"
    volumes: ["./deploy/certs:/certs:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${FOUNDURA_IMAGES:-ghcr.io/prahladnb-spec/foundura}-web:${FOUNDURA_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production # legal and grievance contact details shown on /privacy and /terms
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
