# Production stack on one server: API, web and Caddy (HTTPS), using a managed Postgres database
# (DATABASE_URL). Only Caddy is reachable from the internet.
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# To run Postgres on the same server instead, add the override (also what CI uses):
#   docker compose -f docker-compose.prod.yml -f docker-compose.selfdb.yml --env-file .env.production up -d --build
services:
  # Runs once per deploy: applies migrations, then adds any new seed items (never overwrites edits).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: foundura-api
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    # The managed database's CA certificate, referenced by sslrootcert in DATABASE_URL.
    volumes: ["./deploy/certs:/certs:ro"]
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    restart: "no"

  api:
    image: foundura-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      TRUST_PROXY: "1"
    volumes: ["./deploy/certs:/certs:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
    restart: unless-stopped
    env_file: .env.production # legal and grievance contact details shown on /privacy and /terms
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
