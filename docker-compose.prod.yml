# Production stack on one server: Postgres, API, web and Caddy (HTTPS).
# Only Caddy is reachable from the internet; the API and database stay on the private network.
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foundura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: foundura
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundura"]
      interval: 5s
      retries: 20

  # Runs once per deploy: applies migrations, then adds any new seed items (never overwrites edits).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: foundura-api
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://foundura:${POSTGRES_PASSWORD}@db:5432/foundura
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: foundura-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://foundura:${POSTGRES_PASSWORD}@db:5432/foundura
      TRUST_PROXY: "1"
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
