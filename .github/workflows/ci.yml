name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundura
          POSTGRES_PASSWORD: foundura
          POSTGRES_DB: foundura_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://foundura:foundura@localhost:5432/foundura_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependencies for known security problems
        run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @foundura/shared build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and end-to-end API tests
        run: pnpm test
      - name: Build API and web
        run: pnpm build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundura
          POSTGRES_PASSWORD: foundura
          POSTGRES_DB: foundura_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://foundura:foundura@localhost:5432/foundura_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API and web
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @foundura/e2e exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm e2e
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Build production images
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        run: docker build -f apps/api/Dockerfile -t foundura-api .
      - name: Web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_SITE_URL=https://foundura.org -t foundura-web .
      - name: Check the stack definitions
        run: |
          cp .env.production.example .env.production
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.selfdb.yml --env-file .env.production config --quiet
      - name: Back up and restore with Postgres on the same server
        run: |
          compose="docker compose -f docker-compose.prod.yml -f docker-compose.selfdb.yml --env-file .env.production"
          $compose up -d --wait db
          $compose run --rm migrate
          ./deploy/backup.sh
          ./deploy/restore-drill.sh
          test "$($compose exec -T db psql -U foundura -d foundura -Atc "select count(*) from job_runs where name in ('backup', 'restore_drill') and last_success_at is not null")" = 2
          $compose down -v
          sudo rm -rf backups .env.production
      - name: Managed database over verified SSL, backup and restore drill (as on DigitalOcean)
        run: ./.github/scripts/managed-db-check.sh
