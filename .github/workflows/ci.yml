name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundura
          POSTGRES_PASSWORD: foundura
          POSTGRES_DB: foundura_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://foundura:foundura@localhost:5432/foundura_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @foundura/shared build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and end-to-end API tests
        run: pnpm test
      - name: Build API and web
        run: pnpm build
